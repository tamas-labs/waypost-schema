name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Script tests (generated files up to date, vectors, types, npm install), then the schemas and examples (Ajv).
      - run: npm test
      - run: npm run typecheck
      - name: The tag is the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release.js "$GITHUB_REF_NAME"

  composer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: composer validate
        run: docker run --rm -u "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD":/app:ro -w /app composer:2 validate --strict --no-check-lock
      - name: Composer install and Paths
        run: sh scripts/composer-smoke.sh
      # The backend validates with opis/json-schema: every example has to be decided as Ajv decides it.
      - name: opis/json-schema parity
        run: sh scripts/opis-parity.sh
      # The chain vectors with the PHP recipe of docs/decisions.md, the raw texts through json_decode and opis too.
      - name: Chain vectors in PHP
        run: sh scripts/chain-php.sh
